aid: defacto
name: Defacto
description: >-
  Defacto is an ACPR-authorized French fintech providing instant, embedded financing for small and
  medium-sized businesses across Europe. Through a single REST API, partners (marketplaces, neobanks,
  B2B SaaS, e-invoicing platforms) can onboard borrowers, test eligibility and credit limits, share
  business and bank-transaction data, create invoices, request and manage loans, handle repayments and
  recollection, issue credit cards, bill fees, and subscribe to webhooks. Defacto has powered over EUR 1B
  in financing for 12K+ SMBs through 15+ partners, with products spanning receivables, payables, pay-later,
  cash-in-now, and wallet financing. This profile was enriched by the API Evangelist pipeline from Defacto's
  public developer portal (developers.getdefacto.com).
