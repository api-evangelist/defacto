openapi: 3.0.0
info:
  title: Defacto Accounting Eligibility and credit limit API
  version: v1.0.0
  description: Defacto provides instant, embedded financing for SMBs across Europe. This REST API lets partners onboard borrowers, test eligibility and credit limits, upload business/bank data, create invoices, request and manage loans, handle repayments and recollection, issue and manage credit cards, bill fees, and subscribe to webhooks. Reconstructed by API Evangelist from the per-operation OpenAPI fragments published on Defacto's ReadMe developer portal (developers.getdefacto.com/llms.txt). operationId values are the provider's ReadMe reference slugs; summaries are the reference page titles.
  contact:
    email: contact@getdefacto.com
    url: https://developers.getdefacto.com/
servers:
- url: https://api.getdefacto.com
  description: Production
- url: https://api-sandbox.getdefacto.com
  description: Sandbox
security:
- Bearer: []
tags:
- name: Eligibility and credit limit
paths:
  /credit_line/{credit_line_id}:
    get:
      deprecated: true
      description: '[DEPRECATED] Get credit line by id.<br/> Now use financial-product endpoint'
      parameters:
      - in: query
        name: at
        required: false
        x-nullable: true
        schema:
          type: string
          format: date-time
      - in: path
        name: credit_line_id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/APICreditLine'
      security:
      - Bearer: []
      tags:
      - Eligibility and credit limit
      operationId: get_credit-line-credit-line-id
      summary: /credit_line/{credit_line_id}
  /credit_line:
    get:
      deprecated: true
      description: '[DEPRECATED] Get the credit line associated with your account.<br/>Your partner max-exposure is no longer available by API'
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/APITenantCreditLine'
      security:
      - Bearer: []
      tags:
      - Eligibility and credit limit
      operationId: get_credit-line
      summary: /credit_line
  /credit_lines:
    get:
      description: List all the credit lines that have been opened for your company.<br/>By default, this includes all credit lines that have been created for borrowers you registered, as well as the credit line associated with your account.
      parameters:
      - description: Search by borrower company number (e.g. SIREN or NIF)
        in: query
        name: borrower
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            nullable: true
      - description: Pagination cursor from the previous response's next_page field. Omit to get the first page.
        in: query
        name: cursor
        required: false
        x-nullable: true
        schema:
          type: string
          default: null
      - description: UUID(s) of the credit line(s).
        in: query
        name: id
        required: false
        explode: true
        schema:
          type: array
          items:
            format: uuid
            type: string
            nullable: true
      - description: Maximum number of items to return per page.
        in: query
        name: page_size
        required: false
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TypedApiPage8'
      security:
      - Bearer: []
      tags:
      - Eligibility and credit limit
      operationId: get_credit-lines
      summary: /credit_lines
  /eligibility/reasons:
    get:
      description: List all the possible reasons for which a borrower would not be eligible for a loan.
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/ListDenialCode'
                type: array
      tags:
      - Eligibility and credit limit
      operationId: get_eligibility-reasons
      summary: /eligibility/reasons
  /eligibility/beneficiary:
    post:
      description: "\n<div>\n<h3>Ask if the business can receive the money originated from a loan on one of its bank accounts.</h3>\n\n<p>It should be interpreted the following way:</p>\n<ul>\n<li>when <code>is_eligible</code> is <code>true</code>,\n  it means the business can receive the money originated from a loan on one of its bank accounts.\n</li>\n<li>when <code>is_eligible</code> is <code>false</code>,\n  it means the business can't receive the money originated from a loan.\n  If the business is the borrower's supplier, it does not prevent the borrower from requesting a loan.\n  However, the money has to arrive in a bank account owned by the borrower, not by the supplier.\n</li>\n</ul>\n</div>\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessIdentifierRequired'
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SimpleEligibilityResponse'
      security:
      - Bearer: []
      tags:
      - Eligibility and credit limit
      operationId: post_eligibility-beneficiary
      summary: /eligibility/beneficiary
  /eligibility/borrower:
    post:
      description: "\n<div>\n<h3>Ask for the pre-eligibility of a borrower.</h3>\n\n<p>It should be interpreted the following way:</p>\n<ul>\n<li>when <code>is_eligible</code> is <code>false</code>\n  and <code>reasons</code> is <code>null</code> or <code>[]</code>\n  it means the borrower **might** be eligible.\n  This will depend on his financials and will be evaluated after\n  you share data with the <code>/business/data/XXX</code> endpoints.\n</li>\n<li>when <code>is_eligible</code> is <code>true</code>, the borrower is eligible. However, we recommend\n  you to share the data you have with the <code>/business/data/XXX</code> endpoints in order to have a more\n  accurate (likely higher) eligible amount.\n</li>\n<li>when <code>is_eligible</code> is <code>false</code> and all items of <code>reasons</code> are in:\n  [OUTDATED_DATA, KYB_STATUS] this means the borrower might be eligible depending on his financing,\n  and we are expecting him to perform a few actions prior to requesting loan. Once you register the\n  borrower, this will be represented by the borrower's status.\n</li>\n</ul>\n</div>\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIBorrowerEligibility'
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SimpleEligibilityResponse'
      security:
      - Bearer: []
      tags:
      - Eligibility and credit limit
      operationId: post_eligibility-borrower
      summary: /eligibility/borrower
components:
  schemas:
    APICreditLine:
      properties:
        balance_available:
          default: null
          description: Remaining amount that can be loaned.
          type: integer
          nullable: true
        balance_pending:
          default: 0
          description: ''
          type: integer
        balance_pending_validation:
          default: 0
          description: Amount locked because some loans are pending validation
          type: integer
        contract_number:
          default: null
          type: string
          nullable: true
        currency:
          default: EUR
          enum:
          - EUR
          - GBP
          type: string
        default_borrower:
          allOf:
          - $ref: '#/components/schemas/LightBusiness'
          default: null
          nullable: true
        default_borrower_strategy:
          default: null
          enum:
          - BUYER
          - SELLER
          - null
          type: string
          nullable: true
        default_guarantor:
          allOf:
          - $ref: '#/components/schemas/LightBusiness'
          default: null
          nullable: true
        default_loan_from:
          allOf:
          - $ref: '#/components/schemas/APILightAccountDetails'
          default: null
          nullable: true
        default_repayment_from:
          allOf:
          - $ref: '#/components/schemas/APILightAccountDetails'
          default: null
          nullable: true
        default_repayment_method:
          default: DIRECT_DEBIT
          enum:
          - DIRECT_DEBIT
          - P2P
          - SCT
          type: string
        default_repayment_to:
          allOf:
          - $ref: '#/components/schemas/APILightAccountDetails'
          default: null
          nullable: true
        distribution:
          enum:
          - DIRECT
          - PARTNER
          type: string
        end_date:
          default: null
          format: date-time
          type: string
          nullable: true
        fees_daily_rate:
          default: null
          type: number
          nullable: true
        fees_interest_daily_rate:
          type: number
        fees_operating_daily_rate:
          type: number
        fees_payer:
          allOf:
          - $ref: '#/components/schemas/LightBusiness'
          default: null
          nullable: true
        id:
          default: null
          nullable: true
        loan_contract_type:
          enum:
          - CREDIT_OPERATION
          - CREDIT_OPERATION_WITH_TRADE_RECEIVABLE_GUARANTEE
          - EQUITY_LOAN
          - TRADE_RECEIVABLE
          type: string
        pool_amount:
          default: null
          description: Maximum amount that can be loaned.
          type: integer
          nullable: true
        signed_at:
          default: null
          format: date-time
          type: string
          nullable: true
        start_date:
          format: date-time
          type: string
        vat:
          default: null
          type: number
          nullable: true
      required:
      - distribution
      - fees_interest_daily_rate
      - fees_operating_daily_rate
      - loan_contract_type
      - start_date
      type: object
    APIBorrowerEligibility:
      properties:
        identifier:
          description: Legal identifier of the business, such as its SIRET or SIREN in France. Must not contain spaces.
          type: string
        identifier_type:
          description: Type of legal business identifier of the business, such as the SIRET in France.
          enum:
          - belgium_registration_number
          - bsn
          - cif
          - hr_nummer
          - kvk
          - name
          - nif
          - siren
          - siret
          - steuernummer
          - vat_number
          type: string
      required:
      - identifier
      - identifier_type
      type: object
    APILightAccountDetails:
      properties:
        account_number:
          description: The account identifier. Only IBANs are supported at the moment.
          type: string
        account_number_type:
          description: The type of account number (e.g. IBAN).
          enum:
          - account_number
          - iban
          - internal_id
          type: string
        bank_identifier:
          description: The identifier of the bank.
          type: string
        bank_identifier_type:
          description: The type of bank identifier (e.g. BIC).
          enum:
          - bic
          - name
          - routing_number
          - undefined
          type: string
      required:
      - account_number
      - account_number_type
      - bank_identifier
      - bank_identifier_type
      type: object
    TranslationResult:
      properties:
        de:
          type: string
        en:
          type: string
        es:
          type: string
        fr:
          type: string
      required:
      - de
      - en
      - es
      - fr
      type: object
    ListDenialCode:
      properties:
        denial_code_name:
          type: string
        translations:
          $ref: '#/components/schemas/TranslationResult'
      required:
      - denial_code_name
      - translations
      type: object
