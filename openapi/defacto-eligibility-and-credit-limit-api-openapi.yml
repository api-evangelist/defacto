    TypedApiPage8:
      properties:
        count:
          type: integer
        data:
          items:
            $ref: '#/components/schemas/APICreditLine'
          type: array
        next_page:
          default: null
          type: string
          nullable: true
        page_size:
          type: integer
        previous_page:
          default: null
          type: string
          nullable: true
        total:
          default: null
