          type: string
          nullable: true
        shared_to_account_detail_id:
          default: null
          format: uuid
          type: string
          nullable: true
      required:
      - business_id
      - business_identifier
      - config
      - distribution_id
      - financial_products
      - id
      type: object
    APIBill:
      properties:
        amends_bill_id:
          default: null
          type: string
          nullable: true
        billed_borrower_id:
          default: null
          nullable: true
        billed_business:
          $ref: '#/components/schemas/BusinessIdentifier'
        document_url:
          default: null
          type: string
          nullable: true
        due_date:
          format: date-time
          type: string
        email_sent_to_payer_on:
          default: null
          format: date-time
          type: string
          nullable: true
        end_date:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        invoice:
          allOf:
          - $ref: '#/components/schemas/APIInvoice'
          default: null
          nullable: true
        invoice_number:
          default: null
          type: string
          nullable: true
        payment:
          $ref: '#/components/schemas/PaymentApi'
        ran_at:
          format: date-time
          type: string
        start_date:
          format: date-time
          type: string
        status:
          enum:
          - GENERATED
          - INVALID
          - PAID
          - SENT_TO_PAYER
          - TO_PAY
          - VALIDATED
          type: string
        to_pay_amount:
          type: integer
      required:
      - billed_business
      - due_date
      - end_date
      - id
      - payment
      - ran_at
      - start_date
      - status
      - to_pay_amount
      type: object
    FinancialProductInstallmentsConfiguration:
      properties:
        available_types:
          items:
            enum:
            - INSTALLMENTS
            - IN_FINE
            type: string
          type: array
        maximum_reschedule_payment_in_days:
          default: 30
          type: integer
        minimum_anticipate_payment_in_days:
          default: 1
          type: integer
        minimum_business_days_until_due_date_to_reschedule_payment:
          default: 1
          type: integer
      type: object
    FinancialProductTcsDocument:
      properties:
        country:
          default: null
          enum:
          - AUT
          - BEL
          - BGR
          - CHE
          - CYP
          - CZE
          - DEU
          - DNK
          - ESP
          - EST
          - FIN
          - FRA
          - GBR
          - GRC
          - GUF
          - HRV
          - HUN
          - IRL
          - ISL
          - ITA
          - LTU
          - LUX
          - LVA
          - MAF
          - MLT
          - NLD
          - POL
          - PRT
          - REU
          - ROU
          - SVK
          - SVN
          - SWE
          - null
          type: string
          nullable: true
        document_url:
          type: string
        is_default:
          default: false
          type: boolean
        language:
          default: null
          type: string
          nullable: true
      required:
      - document_url
      type: object
    SignatureConfig:
      properties:
        automatic_signer:
          allOf:
          - $ref: '#/components/schemas/AutomaticSigner'
          default: null
          nullable: true
        contract_template_name:
          enum:
          - DAILLY_CREDIT_AGREEMENT_TEMPLATE
          - DAILLY_ESCOMPTE_TEMPLATE
          - DIRECT_MASTER_LOAN_AGREEMENT_TEMPLATE
          - TERMS_AND_CONDITIONS
          type: string
        signing_fields:
          items:
            $ref: '#/components/schemas/SigningField'
          type: array
      required:
      - contract_template_name
      - signing_fields
      type: object
    LoanPaymentIntent:
      properties:
        amount:
          type: integer
        bill_id:
          default: null
